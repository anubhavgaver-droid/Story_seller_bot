<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PREMIUM STORE BOT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #151c2c;
            --text: #f8fafc;
            --border: #38bdf8;
            --accent: #f59e0b;
            --box-bg: #1e293b;
            --item-bg: #334155;
            --pink-glow: #ff007f;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0 0 90px 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* ---------------- DIRECT REDIRECT LOADER (0 TO 100 ANIMATION) ---------------- */
        #redirect-loader {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #09090d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #redirect-loader.active {
            opacity: 1;
            visibility: visible;
        }

        .anime-icon-box {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            border: 3.5px solid var(--pink-glow);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.7);
            object-fit: cover;
            margin-bottom: 20px;
            animation: pulseImg 1.2s infinite alternate ease-in-out;
        }
        @keyframes pulseImg {
            0% { transform: scale(0.96); box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
            100% { transform: scale(1.06); box-shadow: 0 0 40px rgba(255, 0, 127, 0.9); }
        }

        .redirect-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .redirect-sub {
            font-size: 12px;
            color: #a1a1aa;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* 0 TO 100 ANIMATED COUNTER */
        .counter-text {
            font-size: 52px;
            font-weight: 900;
            background: linear-gradient(90deg, #38bdf8, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            line-height: 1;
            font-family: monospace;
        }

        .progress-bar-track {
            width: 200px;
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 12px;
        }
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #ec4899);
            transition: width 0.03s linear;
        }

        .loading-lbl {
            font-size: 11px;
            font-weight: 800;
            color: #71717a;
            letter-spacing: 2px;
        }

        /* ---------------- WELCOME SPLASH SCREEN ANIMATION ---------------- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #09090d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .cards-stack-wrapper {
            position: relative;
            width: 240px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            perspective: 1000px;
        }

        .fan-card {
            position: absolute;
            width: 130px;
            height: 180px;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
            opacity: 0;
            transform: scale(0.5) translateY(50px);
        }

        .cards-stack-wrapper.active .card-left-2 {
            opacity: 0.6;
            transform: rotate(-24deg) translateX(-70px) scale(0.8);
        }
        .cards-stack-wrapper.active .card-left-1 {
            opacity: 0.85;
            transform: rotate(-12deg) translateX(-35px) scale(0.9);
            z-index: 2;
        }
        .cards-stack-wrapper.active .card-center {
            opacity: 1;
            transform: rotate(0deg) translateY(-10px) scale(1.05);
            z-index: 3;
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
        }
        .cards-stack-wrapper.active .card-right-1 {
            opacity: 0.85;
            transform: rotate(12deg) translateX(35px) scale(0.9);
            z-index: 2;
        }
        .cards-stack-wrapper.active .card-right-2 {
            opacity: 0.6;
            transform: rotate(24deg) translateX(70px) scale(0.8);
        }

        .splash-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-align: center;
        }
        .splash-sub {
            font-size: 11px;
            color: #888888;
            max-width: 260px;
            text-align: center;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        /* ---------------- MAIN APP LAYOUT ---------------- */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: var(--box-bg);
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand-logo { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
        .header-chips { display: flex; gap: 6px; align-items: center; }
        .chip {
            padding: 5px 10px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            font-size: 11px;
            font-weight: 800;
            background: var(--box-bg);
            color: var(--text);
        }
        .chip-yellow { background: var(--accent); color: #000; border-color: var(--accent); }

        .container { padding: 16px; }

        .search-wrapper { position: relative; margin-bottom: 16px; }
        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 14px;
            border: 2px solid var(--border);
            background: var(--box-bg);
            color: var(--text);
            font-weight: 600;
            font-size: 13px;
            outline: none;
        }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; }

        .story-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }
        .card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .card:active { transform: scale(0.97); }
        .card-img { width: 100%; height: 140px; object-fit: cover; border-bottom: 2px solid var(--border); }

        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .badge {
            align-self: flex-start;
            background: #2563eb;
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .title { font-size: 13px; font-weight: 800; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price-tag { font-size: 15px; font-weight: 900; color: var(--accent); margin: 6px 0; }

        .btn-action {
            width: 100%;
            padding: 9px 0;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
        }

        /* ---------------- FULL SCREEN STORY DETAIL MODAL ---------------- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg);
        }

        .modal-hero {
            position: relative;
            width: 100%; height: 42vh;
            background: #000;
            flex-shrink: 0;
        }
        .modal-bg-img {
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.6;
            filter: blur(5px);
            transform: scale(1.1);
        }
        .modal-close-btn {
            position: absolute;
            top: 16px; right: 16px;
            width: 36px; height: 36px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid var(--border);
            border-radius: 50%;
            font-weight: 900;
            font-size: 16px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            z-index: 10;
        }

        .modal-poster-wrapper {
            position: absolute;
            bottom: -20px; left: 16px;
            z-index: 5;
        }
        .modal-poster-img {
            width: 105px; height: 140px;
            object-fit: cover;
            border-radius: 12px;
            border: 2.5px solid var(--border);
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            background: var(--box-bg);
        }

        .modal-body {
            flex-grow: 1;
            padding: 30px 16px 90px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-meta-row { display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 20px; font-weight: 900; margin: 0; color: var(--text); }

        .modal-desc-box {
            background: var(--item-bg);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            font-size: 13px;
            line-height: 1.5;
            color: var(--text);
            font-weight: 500;
        }

        .modal-bottom-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: var(--box-bg);
            border-top: 2px solid var(--border);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            z-index: 20;
        }
        .modal-price { font-size: 22px; font-weight: 900; color: var(--accent); }
    </style>
</head>
<body>

    <!-- DIRECT STORY REDIRECT LOADER OVERLAY (0 TO 100 ANIMATION) -->
    <div id="redirect-loader">
        <img src="https://picsum.photos/200" class="anime-icon-box" id="loaderAnimeImg" alt="Story Icon">
        <div class="redirect-title">REDIRECTING...</div>
        <div class="redirect-sub">Opening requested story</div>
        
        <div class="counter-text" id="counterNum">0%</div>
        <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        
        <div class="loading-lbl">LOADING STORY DATA</div>
    </div>

    <!-- WELCOME SPLASH SCREEN ANIMATION -->
    <div id="splash-screen">
        <div class="cards-stack-wrapper" id="cardsWrapper"></div>
        <div class="splash-title">WELCOME TO STORE</div>
        <div class="splash-sub">Your premium hub for unlocked audio series.</div>
    </div>

    <div class="top-bar">
        <div class="brand-logo">STORE</div>
        <div class="header-chips">
            <span class="chip">🎧 AUDIO</span>
            <span class="chip chip-yellow">🔑 STORE ACTIVE</span>
        </div>
    </div>

    <div class="container">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInp" placeholder="Search series..." onkeyup="doSearch()">
        </div>
        <div class="story-grid" id="homeGrid"></div>
    </div>

    <!-- FULL SCREEN STORY DETAIL MODAL -->
    <div class="modal-overlay" id="storyModal">
        <div class="modal-content">
            <div class="modal-hero">
                <div class="modal-close-btn" onclick="closeModal()">✕</div>
                <img id="mBgImg" src="" class="modal-bg-img">
                <div class="modal-poster-wrapper">
                    <img id="mPosterImg" src="" class="modal-poster-img">
                </div>
            </div>

            <div class="modal-body">
                <div class="modal-meta-row">
                    <span class="badge" id="mPlatform">PLATFORM</span>
                    <span class="chip" id="mAccessType" style="font-size:10px;">PAID SHOW</span>
                </div>

                <h3 class="modal-title" id="mTitle">Story Title</h3>

                <div style="font-size:12px; font-weight:800; color:#a1a1aa; margin-top:8px;">DESCRIPTION</div>
                <div class="modal-desc-box" id="mDesc">
                    Full details and synopsis of the show will appear here.
                </div>
            </div>

            <div class="modal-bottom-bar">
                <div>
                    <div style="font-size:10px; font-weight:800; color:#a1a1aa;">PRICE</div>
                    <div class="modal-price" id="mPrice">₹0</div>
                </div>
                <button class="btn-action" id="mBuyBtn" style="width: auto; padding: 12px 28px;">BUY & UNLOCK</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const BOT_USERNAME = "storysellerbyACbot"; // Apne Telegram Bot Ka Username yahan likhein

        let stories = [];

        /* --- 0% TO 100% COUNTER REDIRECT ANIMATION --- */
        function runDirectRedirectAnimation(callback) {
            // Hide normal splash
            const splash = document.getElementById('splash-screen');
            if(splash) splash.classList.add('hidden');

            const loader = document.getElementById('redirect-loader');
            const counter = document.getElementById('counterNum');
            const fill = document.getElementById('progressFill');
            
            loader.classList.add('active');

            let current = 0;
            const interval = setInterval(() => {
                current += Math.floor(Math.random() * 7) + 3; // Smooth progression
                
                if (current >= 100) {
                    current = 100;
                    counter.innerText = '100%';
                    fill.style.width = '100%';
                    clearInterval(interval);
                    
                    setTimeout(() => {
                        loader.classList.remove('active');
                        if (callback) callback();
                    }, 250);
                } else {
                    counter.innerText = `${current}%`;
                    fill.style.width = `${current}%`;
                }
            }, 30);
        }

        function setupSplashScreen(list) {
            const wrapper = document.getElementById('cardsWrapper');
            if(!wrapper) return;
            wrapper.innerHTML = '';
            
            const shuffled = [...list].sort(() => 0.5 - Math.random());
            const picked = shuffled.slice(0, 5);
            const posClasses = ['card-left-2', 'card-left-1', 'card-center', 'card-right-1', 'card-right-2'];
            
            picked.forEach((story, idx) => {
                const img = document.createElement('img');
                img.src = story.photo || 'https://picsum.photos/200';
                img.className = `fan-card ${posClasses[idx] || 'card-center'}`;
                wrapper.appendChild(img);
            });

            setTimeout(() => { wrapper.classList.add('active'); }, 100);
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if(splash) splash.classList.add('hidden');
            }, 2200);
        }

        /* --- CHECK DEEP LINK PARAMETERS --- */
        function checkUrlParamRouting() {
            let targetStoryParam = null;

            // Telegram WebApp direct start_param read
            if (tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
                targetStoryParam = tg.initDataUnsafe.start_param;
            } else {
                const urlParams = new URLSearchParams(window.location.search);
                targetStoryParam = urlParams.get('story') || urlParams.get('start') || urlParams.get('tgWebAppStartParam');
            }

            if (targetStoryParam) {
                // Remove 'story_' prefix if exists
                targetStoryParam = targetStoryParam.replace(/^story_/, '');
                const cleanQuery = decodeURIComponent(targetStoryParam).replace(/_/g, ' ').toLowerCase().trim();
                
                const foundStory = stories.find(s => {
                    const titleMatch = s.title && s.title.toLowerCase().trim() === cleanQuery;
                    const idMatch = s.id && String(s.id).toLowerCase().trim() === cleanQuery;
                    return titleMatch || idMatch;
                });

                if (foundStory) {
                    if (foundStory.photo) {
                        document.getElementById('loaderAnimeImg').src = foundStory.photo;
                    }

                    // Run 0 to 100 Animation then open modal
                    runDirectRedirectAnimation(() => {
                        openStoryModal(foundStory.id || foundStory.title);
                    });
                    return true;
                }
            }
            return false;
        }

        async function loadStories() {
            try {
                const res = await fetch('/api/stories');
                stories = await res.json();
                
                renderGrid(stories, 'homeGrid');

                // Check Deep Link AFTER stories are loaded
                const isDeepLinked = checkUrlParamRouting();

                if (!isDeepLinked) {
                    if (stories.length > 0) setupSplashScreen(stories);
                    else {
                        const splash = document.getElementById('splash-screen');
                        if(splash) splash.classList.add('hidden');
                    }
                }
            } catch(e) {
                console.error(e);
                const splash = document.getElementById('splash-screen');
                if(splash) splash.classList.add('hidden');
            }
        }

        function renderGrid(list, target) {
            const el = document.getElementById(target);
            if(!el) return;

            if(list.length === 0) {
                el.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #a1a1aa; padding: 40px 0;">No stories found!</div>`;
                return;
            }

            el.innerHTML = list.map((s) => {
                const sKey = s.id || s.title;
                return `
                <div class="card" onclick="openStoryModal('${sKey}')">
                    <img src="${s.photo || 'https://picsum.photos/200'}" class="card-img">
                    <div class="card-body">
                        <span class="badge">${s.platform || 'AUDIO'}</span>
                        <h4 class="title">${s.title}</h4>
                        <div class="price-tag">${s.price == 0 ? 'FREE' : '₹' + s.price}</div>
                        <button class="btn-action">VIEW DETAILS</button>
                    </div>
                </div>
            `}).join('');
        }

        function doSearch() {
            const q = document.getElementById('searchInp').value.toLowerCase().trim();
            const filtered = stories.filter(s => 
                s.title.toLowerCase().includes(q) || 
                (s.platform && s.platform.toLowerCase().includes(q))
            );
            renderGrid(filtered, 'homeGrid');
        }

        function openStoryModal(storyKey) {
            let story = stories.find(s => String(s.id) === String(storyKey) || String(s.title) === String(storyKey));
            if (!story) return;

            const photoUrl = story.photo || 'https://picsum.photos/200';
            document.getElementById('mBgImg').src = photoUrl;
            document.getElementById('mPosterImg').src = photoUrl;
            document.getElementById('mTitle').innerText = story.title;
            document.getElementById('mPlatform').innerText = story.platform || 'AUDIO';
            
            const priceText = story.price == 0 ? 'FREE' : `₹${story.price}`;
            document.getElementById('mPrice').innerText = priceText;
            document.getElementById('mAccessType').innerText = story.price == 0 ? '🎁 FREE ACCESS' : '💎 PAID SHOW';

            document.getElementById('mDesc').innerText = story.description || story.desc || 'Complete audio series package.';

            const buyBtn = document.getElementById('mBuyBtn');
            buyBtn.innerText = story.price == 0 ? 'CLAIM NOW (FREE)' : 'BUY & UNLOCK';
            buyBtn.onclick = function() { buyStory(story.title); };

            document.getElementById('storyModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('storyModal').classList.remove('active');
        }

        function buyStory(title) {
            const cleanTitle = encodeURIComponent(title.replace(/ /g, "_"));
            const deepLink = `https://t.me/${BOT_USERNAME}?start=story_${cleanTitle}`;

            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(deepLink);
                tg.close();
            } else {
                window.location.href = deepLink;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            tg.ready();
            tg.expand();
            loadStories();
        });
    </script>
</body>
</html>
