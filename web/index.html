<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREMIUM STORE BOT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #fafafa;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #000000;
            --accent: #ffcc00;
            --accent-soft: #fffbeb;
            --radius: 18px;
        }

        body {
            margin: 0;
            padding: 0 0 90px 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* TOP HEADER NAV */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #fff;
            border-bottom: 2.5px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand-logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }
        .header-chips {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .chip {
            padding: 5px 10px;
            border-radius: 20px;
            border: 2px solid var(--border);
            font-size: 11px;
            font-weight: 800;
            background: #fff;
            box-shadow: 2px 2px 0px #000;
        }
        .chip-yellow { background: var(--accent); }

        /* CONTENT CONTAINER */
        .container { padding: 16px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* SEARCH BAR */
        .search-wrapper {
            position: relative;
            margin-bottom: 16px;
        }
        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 14px;
            border: 2px solid var(--border);
            background: #fff;
            font-weight: 600;
            font-size: 13px;
            box-sizing: border-box;
            box-shadow: 3px 3px 0px #000;
            outline: none;
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
        }

        /* STORY CARDS GRID */
        .story-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }
        .card {
            background: var(--card-bg);
            border: 2.5px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 4px 4px 0px #000;
            display: flex;
            flex-direction: column;
        }
        .card-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-bottom: 2px solid var(--border);
        }
        .card-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .badge {
            align-self: flex-start;
            background: #2563eb;
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1.5px solid #000;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .title {
            font-size: 13px;
            font-weight: 800;
            margin: 0 0 4px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .price-tag {
            font-size: 15px;
            font-weight: 900;
            color: #000;
            margin: 6px 0;
        }
        .btn-action {
            width: 100%;
            padding: 8px 0;
            background: var(--accent);
            border: 2px solid var(--border);
            border-radius: 10px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            transition: transform 0.1s;
        }
        .btn-action:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #000; }

        /* PROFILE SECTION */
        .profile-card {
            background: #fff;
            border: 2.5px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 4px 4px 0px #000;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            border: 2px solid #000;
            object-fit: cover;
        }
        .id-badge {
            display: inline-block;
            background: var(--accent);
            border: 1.5px solid #000;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            margin-top: 4px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-box {
            background: #fff;
            border: 2.5px solid #000;
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            box-shadow: 3px 3px 0px #000;
        }
        .stat-num { font-size: 22px; font-weight: 900; }
        .stat-lbl { font-size: 10px; font-weight: 800; opacity: 0.7; text-transform: uppercase; }

        /* LIST ITEMS & ORDERS */
        .section-box {
            background: #fff;
            border: 2.5px solid #000;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 3px 3px 0px #000;
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 2px solid #000;
            border-radius: 12px;
            margin-bottom: 8px;
            background: #f8fafc;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            border-top: 2.5px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
        }
        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            font-weight: 900;
            color: #000;
            text-decoration: none;
            opacity: 0.6;
            cursor: pointer;
        }
        .nav-link.active { opacity: 1; color: #000; }
        .nav-link.active .nav-icon {
            background: var(--accent);
            border: 1.5px solid #000;
            border-radius: 10px;
            padding: 2px 10px;
            box-shadow: 1.5px 1.5px 0px #000;
        }
        .nav-icon { font-size: 16px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="brand-logo">STORE</div>
        <div class="header-chips">
            <span class="chip">🎧 AUDIO</span>
            <span class="chip chip-yellow">🔑 <span id="unlockedCount">0</span> UNLOCKED</span>
        </div>
    </div>

    <div class="container">
        
        <!-- 1. HOME TAB -->
        <div id="tab-home" class="tab-content active">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="searchInp" placeholder="Search romantic, thriller, action..." onkeyup="doSearch()">
            </div>
            <div class="story-grid" id="homeGrid"></div>
        </div>

        <!-- 2. EXPLORE TAB -->
        <div id="tab-explore" class="tab-content">
            <div class="section-box">
                <div class="section-title">Categories</div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="chip chip-yellow" onclick="loadStories()">All</button>
                    <button class="chip" onclick="filterCat('pocket')">Pocket FM</button>
                    <button class="chip" onclick="filterCat('pratilipi')">Pratilipi FM</button>
                </div>
            </div>
            <div class="story-grid" id="exploreGrid"></div>
        </div>

        <!-- 3. ORDERS / PURCHASED TAB -->
        <div id="tab-orders" class="tab-content">
            <div class="section-box">
                <div class="section-title">Unlocked Library 📚</div>
                <div id="unlockedList">
                    <p style="font-size:12px; font-weight:700;">No unlocked stories found!</p>
                </div>
            </div>
        </div>

        <!-- 4. PROFILE TAB -->
        <div id="tab-profile" class="tab-content">
            <div class="profile-card">
                <img id="uPhoto" src="https://picsum.photos/100" class="avatar">
                <div>
                    <div id="uName" style="font-weight:900; font-size:16px;">User Name</div>
                    <div class="id-badge">ID: <span id="uId">00000000</span> 📋</div>
                </div>
            </div>

            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-num" id="pUnlocked">0</div>
                    <div class="stat-lbl">Unlocked Stories</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="pTotal">0</div>
                    <div class="stat-lbl">Available Shows</div>
                </div>
            </div>

            <div class="section-box">
                <div class="section-title">Quick Links</div>
                <div class="item-row" onclick="switchTab('orders')">
                    <span style="font-weight:800; font-size:12px;">📁 My Purchased Stories</span>
                    <span>❯</span>
                </div>
            </div>
        </div>

    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <div class="nav-link active" onclick="switchTab('home')">
            <span class="nav-icon">🏠</span>HOME
        </div>
        <div class="nav-link" onclick="switchTab('explore')">
            <span class="nav-icon">🧩</span>EXPLORE
        </div>
        <div class="nav-link" onclick="switchTab('orders')">
            <span class="nav-icon">🔒</span>ORDERS
        </div>
        <div class="nav-link" onclick="switchTab('profile')">
            <span class="nav-icon">👤</span>PROFILE
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let stories = [];
        let userPurchases = [];

        // Fetch User Info
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            document.getElementById('uName').innerText = u.first_name + (u.last_name ? " " + u.last_name : "");
            document.getElementById('uId').innerText = u.id;
            if(u.photo_url) document.getElementById('uPhoto').src = u.photo_url;
            
            // Load Purchases for User
            loadUserPurchases(u.id);
        }

        function switchTab(name) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(e => e.classList.remove('active'));
            
            document.getElementById(`tab-${name}`).classList.add('active');
            
            const tabs = ['home', 'explore', 'orders', 'profile'];
            const idx = tabs.indexOf(name);
            if(idx !== -1) document.querySelectorAll('.nav-link')[idx].classList.add('active');
        }

        async function loadStories() {
            try {
                const res = await fetch('/api/stories');
                stories = await res.json();
                renderGrid(stories, 'homeGrid');
                renderGrid(stories, 'exploreGrid');
                document.getElementById('pTotal').innerText = stories.length;
            } catch(e) { console.error(e); }
        }

        async function loadUserPurchases(userId) {
            try {
                const res = await fetch(`/api/user_purchases?user_id=${userId}`);
                userPurchases = await res.json();
                
                document.getElementById('unlockedCount').innerText = userPurchases.length;
                document.getElementById('pUnlocked').innerText = userPurchases.length;
                
                const box = document.getElementById('unlockedList');
                if(userPurchases.length === 0) {
                    box.innerHTML = '<p style="font-size:12px; font-weight:700;">No unlocked stories. Buy stories to access here!</p>';
                    return;
                }
                
                box.innerHTML = userPurchases.map(p => `
                    <div class="item-row">
                        <div>
                            <div style="font-weight:900; font-size:13px;">${p.story_title}</div>
                            <span style="font-size:10px; color:#16a34a; font-weight:800;">✓ UNLOCKED</span>
                        </div>
                        <button class="chip chip-yellow" onclick="openStoryLink('${p.link || '#'}')">ACCESS</button>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        function renderGrid(list, target) {
            const el = document.getElementById(target);
            if(list.length === 0) {
                el.innerHTML = '<p style="font-size:12px; font-weight:800;">No audio packs found.</p>';
                return;
            }
            el.innerHTML = list.map(s => `
                <div class="card">
                    <img src="${s.photo || 'https://picsum.photos/200'}" class="card-img">
                    <div class="card-body">
                        <span class="badge">${s.platform || 'AUDIO'}</span>
                        <h4 class="title">${s.title}</h4>
                        <div class="price-tag">₹${s.price}</div>
                        <button class="btn-action" onclick="buyStory('${s.title}', ${s.price})">BUY NOW</button>
                    </div>
                </div>
            `).join('');
        }

        function buyStory(title, price) {
            tg.sendData(JSON.stringify({
                action: "buy_story",
                title: title,
                price: price
            }));
        }

        function openStoryLink(url) {
            if(url && url !== '#') tg.openTelegramLink(url);
            else tg.showAlert("Access link will be provided in bot chat.");
        }

        function doSearch() {
            const q = document.getElementById('searchInp').value.toLowerCase();
            const f = stories.filter(s => s.title.toLowerCase().includes(q));
            renderGrid(f, 'homeGrid');
        }

        function filterCat(cat) {
            const f = stories.filter(s => (s.platform && s.platform.toLowerCase().includes(cat)));
            renderGrid(f, 'exploreGrid');
        }

        loadStories();
    </script>
</body>
</html>
